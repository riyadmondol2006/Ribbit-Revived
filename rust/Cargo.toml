[package]
name = "ribbit"
version = "1.2.0"
edition = "2021"
description = "Ribbit Revived - native game engine (rendering, audio synthesis, gameplay)"
publish = false

[lib]
name = "ribbit"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
